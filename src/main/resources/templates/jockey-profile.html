<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Thông tin Kỵ sĩ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/jockey/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/jockey/schedule" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📅 Lịch đua</a></li>
            <li><a href="/jockey/profile" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">👤 Thông tin</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Thông tin cá nhân</h1>
    <div class="bg-white rounded-lg shadow p-8 max-w-2xl">
        <div class="flex items-center gap-6 mb-6">
            <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center text-4xl">🏇</div>
            <div>
                <p class="text-2xl font-bold text-gray-800" th:text="${jockey.fullName}">Jack Jockey</p>
                <p class="text-gray-500" th:text="${jockey.email}">jockey@horseracing.com</p>
                <span class="px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-800" th:text="${jockey.status}">active</span>
            </div>
        </div>
    </div>
</main>
</body>
</html>
