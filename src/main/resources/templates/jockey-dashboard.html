<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Dashboard Kỵ sĩ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/jockey/dashboard" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">📊 Dashboard</a></li>
            <li><a href="/jockey/schedule" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📅 Lịch đua</a></li>
            <li><a href="/jockey/profile" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">👤 Thông tin</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Dashboard Kỵ sĩ</h1>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <p class="text-gray-500">Tổng cuộc đua</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalRaces}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
            <p class="text-gray-500">Chiến thắng</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalWins}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
            <p class="text-gray-500">Tổng điểm</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalPoints}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-purple-500">
            <p class="text-gray-500">Cuộc đua sắp tới</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${upcomingRaces != null ? upcomingRaces.size() : 0}">0</p>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold mb-4">📅 Lịch đua sắp tới</h3>
        <div th:each="race : ${upcomingRaces}" class="border-b last:border-b-0 py-3 flex justify-between items-center">
            <div>
                <p class="font-semibold" th:text="${race.name}">Summer Cup</p>
                <p class="text-sm text-gray-500" th:text="${race.raceDatetime}">14/07/2026 09:00</p>
            </div>
            <span class="text-sm bg-green-100 text-green-800 px-3 py-1 rounded-full">Sắp diễn ra</span>
        </div>
        <div th:if="${upcomingRaces == null or upcomingRaces.isEmpty()}" class="text-center py-4 text-gray-400">
            Không có cuộc đua nào
        </div>
    </div>
</main>
</body>
</html>
