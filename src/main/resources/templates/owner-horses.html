<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Ngựa của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/owner/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/owner/horses" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">🐴 Ngựa của tôi</a></li>
            <li><a href="/owner/results" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏁 Kết quả</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Ngựa của tôi</h1>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div th:each="horse : ${horses}" class="bg-white rounded-lg shadow p-4">
            <div class="text-4xl mb-2">🐴</div>
            <p class="font-bold" th:text="${horse.name}">Lightning</p>
            <p class="text-sm text-gray-500" th:text="${horse.breed}">Thoroughbred</p>
            <p class="text-sm text-gray-500" th:text="${horse.age} + ' tuổi'">5 tuổi</p>
        </div>
        <div th:if="${horses == null or horses.isEmpty()}" class="col-span-4 text-center py-8 text-gray-400">
            Chưa có ngựa nào
        </div>
    </div>
</main>
</body>
</html>
