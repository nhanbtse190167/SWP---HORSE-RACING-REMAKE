<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<!-- Sidebar -->
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/admin/dashboard" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">📊 Dashboard</a></li>
            <li><a href="/admin/horses" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🐴 Ngựa</a></li>
            <li><a href="/admin/tournaments" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏆 Giải đấu</a></li>
            <li><a href="/admin/users" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">👥 Người dùng</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>

<!-- Main -->
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Admin Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <p class="text-gray-500">Tổng ngựa</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalHorses}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
            <p class="text-gray-500">Tổng kỵ sĩ</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalJockeys}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
            <p class="text-gray-500">Tổng người dùng</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalUsers}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-purple-500">
            <p class="text-gray-500">Tổng giải đấu</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalTournaments}">0</p>
        </div>
    </div>
</main>
</body>
</html>
