<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Quản lý người dùng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/admin/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/admin/horses" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🐴 Ngựa</a></li>
            <li><a href="/admin/tournaments" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏆 Giải đấu</a></li>
            <li><a href="/admin/users" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">👥 Người dùng</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Quản lý người dùng</h1>
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
            <tr class="text-left text-gray-600">
                <th class="p-3">ID</th>
                <th class="p-3">Tên</th>
                <th class="p-3">Email</th>
                <th class="p-3">Vai trò</th>
                <th class="p-3">Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}" class="border-t hover:bg-gray-50">
                <td class="p-3" th:text="${user.id}">1</td>
                <td class="p-3 font-semibold" th:text="${user.fullName}">Admin</td>
                <td class="p-3" th:text="${user.email}">admin@horseracing.com</td>
                <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs bg-purple-100 text-purple-800" th:text="${user.role}">Admin</span></td>
                <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs" th:classappend="${user.status == 'active'} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" th:text="${user.status}">active</span></td>
            </tr>
            <tr th:if="${users == null or users.isEmpty()}">
                <td colspan="5" class="text-center py-8 text-gray-400">Chưa có người dùng nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
