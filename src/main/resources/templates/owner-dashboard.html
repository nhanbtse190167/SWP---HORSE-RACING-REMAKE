<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Dashboard Chủ ngựa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/owner/dashboard" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">📊 Dashboard</a></li>
            <li><a href="/owner/horses" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🐴 Ngựa của tôi</a></li>
            <li><a href="/owner/results" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏁 Kết quả</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Dashboard Chủ ngựa</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <p class="text-gray-500">Ngựa của tôi</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalHorses}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
            <p class="text-gray-500">Tổng cuộc đua</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalRaces}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
            <p class="text-gray-500">Chiến thắng</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${totalWins}">0</p>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold mb-4">🐴 Danh sách ngựa của tôi</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div th:each="horse : ${myHorses}" class="border rounded-lg p-4">
                <p class="font-bold" th:text="${horse.name}">Lightning</p>
                <p class="text-sm text-gray-500" th:text="${horse.breed}">Thoroughbred</p>
                <p class="text-sm text-gray-500" th:text="${horse.age} + ' tuổi'">5 tuổi</p>
            </div>
            <div th:if="${myHorses == null or myHorses.isEmpty()}" class="col-span-3 text-center py-4 text-gray-400">
                Chưa có ngựa nào
            </div>
        </div>
    </div>
</main>
</body>
</html>
