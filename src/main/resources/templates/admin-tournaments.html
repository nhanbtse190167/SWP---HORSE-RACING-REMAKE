<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Quản lý giải đấu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/admin/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/admin/horses" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🐴 Ngựa</a></li>
            <li><a href="/admin/tournaments" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">🏆 Giải đấu</a></li>
            <li><a href="/admin/users" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">👥 Người dùng</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Quản lý giải đấu</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div th:each="tournament : ${tournaments}" class="bg-white rounded-lg shadow p-6">
            <h3 class="font-bold text-xl" th:text="${tournament.name}">Summer Cup</h3>
            <p class="text-sm text-gray-500" th:text="${tournament.startDate} + ' - ' + ${tournament.endDate}">01/07 - 15/07</p>
            <p class="text-sm"><span class="px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-800" th:text="${tournament.status}">active</span></p>
        </div>
        <div th:if="${tournaments == null or tournaments.isEmpty()}" class="col-span-3 text-center py-8 text-gray-400">
            Chưa có giải đấu nào
        </div>
    </div>
</main>
</body>
</html>
