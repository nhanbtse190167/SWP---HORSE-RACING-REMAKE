<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Dashboard Trọng tài</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/referee/dashboard" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">📊 Dashboard</a></li>
            <li><a href="/referee/results" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏁 Kết quả</a></li>
            <li><a href="/referee/violations" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">⚠️ Vi phạm</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Dashboard Trọng tài</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
            <p class="text-gray-500">Kết quả chờ xác nhận</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${pendingResults != null ? pendingResults.size() : 0}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-red-500">
            <p class="text-gray-500">Vi phạm chờ xử lý</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${pendingViolations != null ? pendingViolations.size() : 0}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <p class="text-gray-500">Cuộc đua hôm nay</p>
            <p class="text-3xl font-bold text-[#041627]" th:text="${todayRaces != null ? todayRaces.size() : 0}">0</p>
        </div>
    </div>
</main>
</body>
</html>
