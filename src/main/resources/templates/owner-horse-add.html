<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Thêm ngựa mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/owner/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/owner/horses" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🐴 Ngựa của tôi</a></li>
            <li><a href="/owner/results" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏁 Kết quả</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Thêm ngựa mới</h1>
    <div class="bg-white rounded-lg shadow p-8 max-w-2xl">
        <form th:action="@{/owner/horses/add}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Tên ngựa *</label>
                <input type="text" name="name" class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Giống</label>
                <input type="text" name="breed" class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Tuổi</label>
                <input type="number" name="age" class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400">
            </div>
            <button type="submit" class="w-full bg-[#041627] text-white py-3 rounded hover:bg-[#1a2b3c] transition font-semibold">Thêm ngựa</button>
        </form>
    </div>
</main>
</body>
</html>
