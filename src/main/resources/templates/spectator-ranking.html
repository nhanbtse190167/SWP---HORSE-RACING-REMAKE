<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Bảng xếp hạng</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/spectator/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/spectator/predict" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🔮 Dự đoán</a></li>
            <li><a href="/spectator/ranking" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">🏆 Xếp hạng</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">🏆 Bảng xếp hạng dự đoán</h1>
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
            <tr class="text-left text-gray-600">
                <th class="p-3">#</th>
                <th class="p-3">Tên</th>
                <th class="p-3">Tổng điểm</th>
                <th class="p-3">Số dự đoán</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rank, iterStat : ${rankings}" class="border-t hover:bg-gray-50">
                <td class="p-3 font-semibold">
                    <span th:if="${iterStat.index == 0}" class="text-yellow-500 text-xl">🥇</span>
                    <span th:elif="${iterStat.index == 1}" class="text-gray-400 text-xl">🥈</span>
                    <span th:elif="${iterStat.index == 2}" class="text-orange-400 text-xl">🥉</span>
                    <span th:unless="${iterStat.index < 3}" th:text="${iterStat.index + 1}"></span>
                </td>
                <td class="p-3 font-semibold" th:text="${rank[0]}">John Doe</td>
                <td class="p-3 font-bold" th:text="${rank[1]}">1250</td>
                <td class="p-3" th:text="${rank[2]}">15</td>
            </tr>
            <tr th:if="${rankings == null or rankings.isEmpty()}">
                <td colspan="4" class="text-center py-8 text-gray-400">Chưa có dữ liệu xếp hạng</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
